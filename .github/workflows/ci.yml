name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.11 via aqtinstall
        run: |
          pip install --quiet aqtinstall
          aqt install-qt mac desktop 6.11.0 clang_64 -O "$RUNNER_TEMP/qt"

      - name: Configure
        # aqt 用 clang_64 架构安装，但 Qt 6.11 的安装目录名仍是 macos
        run: cmake -B build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qt/6.11.0/macos"

      - name: Build test targets
        # 只构建测试与基准 target，跳过 NewWord.app / render 等重型产物
        run: cmake --build build --target NewWordCoreTests NewWordDocTabSmokeTests NewWordBenchEditorPerf -j

      - name: Run tests (ctest, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Run editor performance benchmark
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/NewWordBenchEditorPerf
